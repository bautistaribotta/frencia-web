<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frencia · Wizard cardio e isométricos</title>
<script>(function(){try{var t=localStorage.getItem('frencia-theme');document.documentElement.dataset.theme=(t==='light'||t==='dark')?t:'dark';}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{margin:0}
body{background-color:var(--stage-bg);color:var(--text-primary);font-family:var(--font-sans);padding:32px 40px 80px}
a{color:var(--signal-text)}a:hover{color:var(--accent-hover)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-family:var(--font-display);font-weight:500;letter-spacing:-0.035em;font-size:44px;line-height:1;margin:6px 0 0;letter-spacing:var(--ls-display)}
.lead{font-size:15px;color:var(--text-secondary);max-width:820px;line-height:1.55;margin:0}
.sec{margin-top:44px}
.sec h2{font:var(--fw-bold) 20px var(--font-sans);margin:0 0 4px}
.sec>p{margin:0 0 18px;font-size:14px;color:var(--text-secondary);max-width:820px;line-height:1.5}
.row{display:flex;gap:28px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.ph{flex:none;display:flex;flex-direction:column;gap:10px;width:375px}
.ph__cap{display:flex;gap:10px;align-items:baseline;font:var(--fw-semibold) 11px var(--font-sans);letter-spacing:var(--ls-wider);text-transform:uppercase;color:var(--text-secondary)}
.ph__cap b{color:var(--text-primary)}
.ph__id{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:6px;background:var(--accent);color:var(--text-on-accent);font-weight:700;letter-spacing:0}
.ph__id--ref{background:var(--surface-chip);color:var(--text-secondary)}
.ph__note{font-size:13px;line-height:1.45;color:var(--text-secondary);margin:0;min-height:56px;text-wrap:pretty}
.ph__dev{width:375px;height:812px;display:flex;flex-direction:column;border-radius:44px;background:radial-gradient(70% 45% at 96% 0%,color-mix(in srgb,var(--glow-a) 22%,transparent),transparent 72%),radial-gradient(90% 60% at 0% 70%,color-mix(in srgb,var(--glow-b) 60%,transparent),transparent 72%),radial-gradient(50% 30% at 100% 100%,color-mix(in srgb,var(--glow-c) 12%,transparent),transparent 70%),var(--bg-app);border:1px solid var(--border-subtle);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.ph__sb{flex:none}
.ph__scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.ph__scroll::-webkit-scrollbar{display:none}
.ph__sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:var(--fw-semibold) 15px var(--font-sans);color:var(--text-primary)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../components/bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="tipos.data.js"></script>
<script src="log-fallback.js"></script>
<script type="text/babel" src="theme-toggle.jsx"></script>
<script type="text/babel" src="WizardVariants.jsx"></script>
<script type="text/babel" data-presets="react">
function Phone({ id, cap, note, ref_, children }) {
  return (
    <div className="ph" data-screen-label={id + ' ' + cap}>
      <span className="ph__cap"><span className={'ph__id' + (ref_ ? ' ph__id--ref' : '')}>{id}</span><b>{cap}</b></span>
      <p className="ph__note">{note}</p>
      <div className="ph__dev">
        <div className="ph__sb"><span>9:41</span><span style={{ display: 'inline-flex', gap: 6 }}><i data-lucide="signal" style={{ width: 16, height: 16 }}></i><i data-lucide="battery-full" style={{ width: 18, height: 18 }}></i></span></div>
        <div className="ph__scroll">{children}</div>
      </div>
    </div>
  );
}

function Page() {
  const [theme, setTheme] = useTheme();
  const W = window.WZ;
  React.useEffect(() => { window.lucide && lucide.createIcons(); });
  return (
    <div key={theme}>
      <div className="top">
        <div><span className="frencia-label">Frencia · Sesión</span><h1>Wizard · cardio e isométricos</h1></div>
        <ThemeToggle theme={theme} onChange={setTheme} />
      </div>
      <p className="lead">En fuerza, Saltar serie está en el título de la serie, a la derecha, y desaparece apenas se carga un dato. En las seis variantes nuevas queda en ese mismo lugar y con la misma regla. Lo que cambia entre variantes es cómo se carga la serie. Las pantallas son interactivas.</p>

      <div className="sec">
        <h2>Hoy en el repo</h2>
        <p>Referencia de src/app/session.tsx. En cardio e isométricos Saltar está centrado debajo de los campos, y su posición depende de cuántos campos tenga el ejercicio.</p>
        <div className="row">
          <Phone id="R1" ref_ cap="Fuerza" note="Saltar en el título de la serie. La grilla se ancla abajo, cerca de Siguiente."><W.FuerzaActual /></Phone>
          <Phone id="R2" ref_ cap="Isométrico" note="Saltar al pie, debajo del RPE. Con peso opcional baja todavía más."><W.IsoActual /></Phone>
          <Phone id="R3" ref_ cap="Cardio" note="Saltar al pie, debajo de tres campos: queda fuera de vista al abrir el teclado."><W.CardioActual /></Phone>
        </div>
      </div>

      <div className="sec">
        <h2>Isométricos · plancha</h2>
        <p>Probá Empezar y Frenar. En B y C el control del cronómetro pasa a la barra de abajo, así el botón grande está siempre en el mismo lugar.</p>
        <div className="row">
          <Phone id="1A" cap="Mínimo cambio" note="El layout de hoy, con Saltar movido al título. Es el cambio más chico para unificar con fuerza."><W.IsoA /></Phone>
          <Phone id="1B" cap="Anclado como fuerza" note="Contexto arriba y cronómetro en la zona del pulgar. Empezar, Frenar y Siguiente se turnan en el mismo botón de la barra."><W.IsoB /></Phone>
          <Phone id="1B" cap="Anclado · contando" note="Mientras mide, Saltar se oculta: la serie ya no está vacía."><W.IsoB initialPhase="running" initialElapsed={31} /></Phone>
          <Phone id="1C" cap="Foco en el esfuerzo" note="Plan y anterior en dos líneas para dejarle la pantalla al reloj. Al frenar, el RPE se marca con un toque."><W.IsoC /></Phone>
        </div>
      </div>

      <div className="sec">
        <h2>Cardio · cinta</h2>
        <p>Serie única: el botón dice Saltar y terminar porque es el último paso de la sesión.</p>
        <div className="row">
          <Phone id="2A" cap="Mínimo cambio" note="Los mismos tres campos, con Saltar en el título. Es igual que 1A."><W.CardioA /></Phone>
          <Phone id="2B" cap="Hoy en la grilla" note="Vuelve la fila Hoy, como en fuerza. Se elige un dato y abajo aparece solo ese campo, así la grilla y el campo entran juntos con el teclado abierto."><W.CardioB /></Phone>
          <Phone id="2C" cap="Cronómetro en vivo" note="Misma mecánica que 1B: el teléfono mide y la distancia se carga al final. También deja cargar a mano lo que marca la máquina."><W.CardioC /></Phone>
          <Phone id="2C" cap="En vivo · corriendo" note="El cronómetro de cardio usa lume porque no tiene un objetivo de esfuerzo. La tinta queda para la intensidad."><W.CardioC initialPhase="running" initialElapsed={754} /></Phone>
        </div>
      </div>
    </div>
  );
}
window.__frenciaLogReady.then(() => ReactDOM.createRoot(document.getElementById('root')).render(<Page />));
</script>
</body>
</html>
