<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Frencia</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg-app); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden; }
  .portada { position: relative; height: 288px; overflow: hidden;
    background: radial-gradient(42% 90% at 88% 70%, color-mix(in srgb, var(--glow-a) 34%, transparent), transparent 72%), radial-gradient(50% 120% at 0% 100%, color-mix(in srgb, var(--glow-b) 80%, transparent), transparent 72%), var(--bg-app); }
  .arte { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .arte svg { display: block; width: 480px; height: 288px; }
  .tinta { fill: var(--text-primary); }
  .acero { fill: var(--signal); filter: drop-shadow(0 0 18px color-mix(in srgb, var(--signal) 45%, transparent)); }
  .ambar { fill: var(--glow-a); opacity: .55; }
  .tarjeta { fill: var(--surface-card-elevated); stroke: var(--glass-line); stroke-width: 1; }
  .corte { stroke: var(--bg-app); stroke-width: 2; }
  .corte-tarjeta { stroke: var(--text-tertiary); stroke-width: 1; }
  .losa { rx: var(--radius-xl); }
  .chico { rx: var(--radius-sm); }
  .textos { position: absolute; left: var(--space-7); bottom: var(--space-7); max-width: 440px; }
  .nombre { margin: 0; font-family: var(--font-display); font-weight: var(--fw-medium); font-size: 104px; line-height: .95; letter-spacing: -0.045em; color: var(--text-primary); }
  .lema { margin: var(--space-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="portada">
<div class="arte" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  bloques     text-primary 144x320 (la losa de tinta, sangra arriba y abajo) · signal cuarto de esfera r 224 en lume (sangra abajo a la derecha) · surface-card-elevated 96x112 de vidrio · glow-a 40x40 (la luz, chica) — cerca del 40% de 960x288
  arreglo     una losa alta de tinta a la izquierda, la esfera de lume entrando desde la esquina y dos satelites entre ambas, gutters space-5
  patron      la esfera del descanso, de "la esfera: un dial de 60 marcas con un arco de lume": 16 marcas radiales cada 6 grados recortadas en bg-app sobre el borde del cuarto de esfera, largas cada 5; y 5 marcas de escala sobre la tarjeta de alivio
  escalas     gutters space-5 (16); marcas 8 y 16 px; radios radius-xl (losa), radius-sm (ambar), radius-lg (tarjeta)
-->
<rect class="tinta losa" x="16" y="-16" width="144" height="320" rx="16"/>
<rect class="tarjeta" x="176" y="24" width="96" height="112" rx="14"/>
<line class="corte-tarjeta" x1="192" y1="112" x2="192" y2="120"/>
<line class="corte-tarjeta" x1="208" y1="116" x2="208" y2="120"/>

<rect class="ambar chico" x="176" y="152" width="40" height="40" rx="6"/>
<path class="acero" d="M 480 64 A 224 224 0 0 0 256 288 L 480 288 Z"/>
<g>
  <line class="corte" x1="480.00" y1="64.00" x2="480.00" y2="80.00"/>
  <line class="corte" x1="456.59" y1="65.23" x2="457.42" y2="73.18"/>
  <line class="corte" x1="433.43" y1="68.89" x2="435.09" y2="76.72"/>

  <line class="corte" x1="368.00" y1="94.01" x2="376.00" y2="107.87"/>
  <line class="corte" x1="348.34" y1="106.78" x2="353.04" y2="113.25"/>

  <line class="corte" x1="313.54" y1="138.11" x2="319.48" y2="143.47"/>

  <line class="corte" x1="266.96" y1="218.78" x2="274.57" y2="221.25"/>

  <line class="corte" x1="256.00" y1="288.00" x2="272.00" y2="288.00"/>
</g>
</svg>
</div>
<div class="textos">
<h1 class="nombre">Frencia</h1>
<p class="lema">Cada serie cuenta.</p>
</div>
</div>
</body>
</html>
